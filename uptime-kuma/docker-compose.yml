# Docker compose file for running Uptime Kuma on TrueNAS Scale

services:
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    restart: unless-stopped

    ports:
      # Web interface - Access at http://your-truenas-ip:3001
      - "3001:3001"

    volumes:
      # Persistent data storage
      - /mnt/tank/apps/uptime-kuma/data:/app/data

    environment:
      # Timezone configuration (adjust to your local timezone)
      - TZ=UTC
      - UMASK=0022

    # Health check (optional)
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Labels for organization
    labels:
      - "com.truenas.app=uptime-kuma"
      - "com.truenas.description=Self-hosted monitoring and uptime tool"
